name: Build Modulo Zygisk HideMap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compilar módulo nativo
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=app/src/main APP_BUILD_SCRIPT=app/src/main/jni/Android.mk NDK_APPLICATION_MK=app/src/main/jni/Application.mk

      - name: Empacotar ZIP instalável do Magisk 30.7
        run: |
          mkdir -p module/zygisk module/META-INF/com/google/android
          cat << 'EOF' > module/META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          ui_print() { echo "$1"; }
          require_new_magisk() {
            ui_print "Please install Magisk v20.4+!"
            exit 1
          }
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          [ $API -lt 21 ] && require_new_magisk
          install_module
          exit 0
          EOF
          printf "#MAGISK\n" > module/META-INF/com/google/android/updater-script
          cp app/src/main/libs/armeabi-v7a/libhidemap.so module/zygisk/armeabi-v7a.so
          if [ -f "app/src/main/libs/arm64-v8a/libhidemap.so" ]; then
            cp app/src/main/libs/arm64-v8a/libhidemap.so module/zygisk/arm64-v8a.so
          fi
          printf "id=zygisk_hidemap\nname=Zygisk HideMap (Remap)\nversion=v1.0\nversionCode=1\nauthor=Custom\ndescription=Remapeia bibliotecas de /data/adb/modules para memoria anonima\n" > module/module.prop
          cd module && zip -r ../Zygisk-HideMap.zip .

      - name: Salvar módulo ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-HideMap-Module
          path: Zygisk-HideMap.zip
